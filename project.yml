name: BudgetApp
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.budgetapp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - BudgetAppTests
  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BudgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.budgetapp.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
